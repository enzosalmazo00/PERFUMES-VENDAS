name: Generate secondary fragrance matches
on:
  push:
    paths:
      - ".github/workflows/enrich-fragrances-secondary.yml"
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/enrich_fragrances_secondary.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enrichment-secondary.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: generate secondary fragrance matches"
            git push
          fi
