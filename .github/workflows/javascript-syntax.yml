name: JavaScript syntax guard
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all JavaScript files
        run: |
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file" || exit 1
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
