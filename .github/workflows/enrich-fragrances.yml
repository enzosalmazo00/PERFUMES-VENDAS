name: Enrich fragrance catalog
on:
  push:
    paths:
      - ".github/workflows/enrich-fragrances.yml"
      - "scripts/enrich_fragrances_open_data.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate enrichment matches
        run: python scripts/enrich_fragrances_open_data.py
      - name: Commit generated match file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enrichment-open-data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: generate fragrance enrichment matches"
            git push
          fi
