name: Enrich pending perfumes from Parfumo
on:
  push:
    paths:
      - ".github/workflows/enrich-parfumo-live.yml"
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl source-backed fragrance pyramids
        run: python scripts/enrich_parfumo_live.py
      - name: Commit generated enrichment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enrichment-parfumo-live.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: generate live Parfumo fragrance enrichment"
            git push
          fi
