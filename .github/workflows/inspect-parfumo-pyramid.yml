name: Inspect Parfumo pyramid markup
on:
  push:
    paths:
      - ".github/workflows/inspect-parfumo-pyramid.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import urllib.request
          u='https://www.parfumo.com/Perfumes/Afnan_Perfumes/9am-dive'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          s=urllib.request.urlopen(req,timeout=30).read().decode('utf-8',errors='replace')
          for key in ['Top Notes','Heart Notes','Base Notes','Fragrance Pyramid']:
              i=s.find(key)
              print('\nKEY',key,'AT',i)
              print(s[max(0,i-500):i+1500].replace('\n',' ') if i>=0 else 'NOT FOUND')
          PY
