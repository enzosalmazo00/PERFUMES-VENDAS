name: Final Parfumo matching
# retry2
on:
  push:
    paths:
      - ".github/workflows/enrich-parfumo-final.yml"
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/enrich_parfumo_final.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enrichment-parfumo-final.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: generate final Parfumo matches"
            git push
          fi
