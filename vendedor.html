<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Vendedor — Parfums</title><link rel="stylesheet" href="painel.css"><link rel="stylesheet" href="admin.css"></head><body><main class="shell"><section class="auth-card" id="loginView"><div class="brand">✦ <span>PARFUMS</span></div><p class="eyebrow">Vendedor</p><h1>Meu painel</h1><form id="loginForm"><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="password" type="password" minlength="8" required></label><button class="btn btn-primary">Entrar</button><button class="btn btn-ghost" id="createAccess" type="button">Criar primeiro acesso</button></form><p id="loginMessage" class="form-message"></p></section><section id="app" hidden><header class="panel-head"><div><div class="brand">✦ <span>PARFUMS</span></div><p class="eyebrow">Vendedor</p><h1 id="sellerName">Meu estoque</h1></div><div class="admin-actions"><a class="btn btn-ghost" href="index.html" target="_blank">Abrir loja</a><button class="btn btn-ghost" id="logout">Sair</button></div></header><div id="metrics" class="metrics"></div><div class="card"><p class="eyebrow">Central de notificações</p><h2>Alertas de estoque baixo</h2><div id="alerts"></div></div><div class="card"><p class="eyebrow">Estoque</p><h2>Produtos sob minha responsabilidade</h2><div id="inventory"></div></div><div class="card" id="emergencyCard" hidden><p class="eyebrow">Área de emergência</p><h2>Controle da loja</h2><p class="muted">Use somente quando houver problema operacional real.</p><label>Categoria<select id="kind"><option value="stock_issue">Problema de estoque</option><option value="inventory_count">Contagem de estoque</option><option value="maintenance">Manutenção/erro</option><option value="no_seller">Sem vendedor disponível</option><option value="operational_pause">Pausa operacional</option></select></label><label>Justificativa<textarea id="reason"></textarea></label><button class="btn btn-danger" id="disable">Desativar temporariamente</button><button class="btn btn-primary" id="enable">Colocar online</button><p id="status" class="muted"></p></div></section></main><div class="toast" id="toast"></div><script type="module" src="vendedor.js"></script></body></html>
